<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – Reseller Apple</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1d1d1f;
    }
    .container {
      text-align: center;
      padding: 2rem;
      max-width: 400px;
    }
    .icon { font-size: 5rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.8rem; margin-bottom: 1rem; }
    p { color: #6e6e73; margin-bottom: 2rem; line-height: 1.6; }
    button {
      background: #0071e3;
      color: white;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 980px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #0077ed; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🍎</div>
    <h1>Jesteś offline</h1>
    <p>Brak połączenia z internetem. Sprawdź swoje połączenie i spróbuj ponownie. Produkty dodane do koszyka zostały zapisane lokalnie.</p>
    <button onclick="window.location.reload()">Spróbuj ponownie</button>
  </div>
</body>
</html>
